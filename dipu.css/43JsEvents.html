<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Events</title>
</head>
<style>
    #btn {
        padding: 10px 14px;
        background-color: red;
        border: 2px solid black;
        color: white;
        front-weight: bold;
        border-radius: 5px;
        cursor: pointer;

    }
        
</style>
    
<body>
    <!-- Browser Events:
    click
    contextmenu
    mouseover/mouseout
    mousedown/mouseup
    mousemove

    submit
    focus

    DOMcontentLoaded

    transitionend -->

    <div class="container">
        <h1>This is my Heading</h1>
        <p id="para">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quam necessitatibus illo maxime repudiandae sequi totam velit? Tempora esse eveniet perferendis aperiam ullam accusantium labore est molestiae, nulla voluptates voluptas cumque harum ea?</p>
    </div>
    <button id="btn" onclick="toggleHide()">Show/Hide</button>
    <script>

        let para = document.getElementById('para');
        para.addEventListener('mouseover', function run(){
            console.log('mouse Inside')
        });

        para.addEventListener('mouseout', function run(){
            console.log('mouse now went outside')
        });

        function toggleHide() {
            let btn = document.getElementById('btn');
            let para = document.getElementById('para'); 
            if(para.style.display != 'none'){
            para.style.display = 'none';
            }
            else{
                para.style.display = 'block';

            }
            
        }
    </script>
</body>
</html>
