<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Object</title>
</head>
<body>
    <div class="container">
        <h1>This is a Maths Object</h1>
    </div>
    <script>

        // printing the Maths Object

        let m = Maths;
        console.log(m)

        // printing the value of some properties of Maths Object

        console.log("The value of Math.E is ", Math.E)
        console.log("The value of Math.PI is ", Math.PI)
        console.log("The value of Math.LN2 is ", Math.LN2)
        console.log("The value of Math.SQRT1_2 is ", Math.SQRT1_2)
        console.log("The value of Math.LOG2E is ", Math.LOG2E)


        let a = 35.5;
        let b = 80;
        console.log("The value of a and b is ", a, b)


    </script>
</body>
</html>
