<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Object</title>
</head>
<body>
    <div class="container">
        <h1>This is a Maths Object</h1>
    </div>
    <script>

        // printing the Maths Object

        let m = Maths;
        console.log(m)

        // printing the value of some properties of Maths Object

        console.log("The value of Math.E is ", Math.E)
        console.log("The value of Math.PI is ", Math.PI)
        console.log("The value of Math.LN2 is ", Math.LN2)
        console.log("The value of Math.SQRT1_2 is ", Math.SQRT1_2)
        console.log("The value of Math.LOG2E is ", Math.LOG2E)


        let a = 35.5;
        let b = 80;
        console.log("The value of a and b is ", a, b);
        console.log("The value of a and b rounded is ", Math.round(a), Math.round(b));

        console.log("3 raised to the power of 2 is ", Math.pow(3, 2))
        console.log("2 raised to the power of 12 is ", Math.pow(2, 12))
        console.log("1 raised to the power of 2 is ", Math.pow(1, 2))

        console.log("square root of 16 is ", Math.sqrt(16))
        console.log("square root of 36 is ", Math.sqrt(36))
        console.log("square root of 50 is ", Math.sqrt(50))

        console.log("5.8 rounded to the nearest integer is ", Math.ceil(5.8))
        console.log("5.8 rounded down to the nearest integer is ", Math.floor(5.8))

        console.log("Absolute value of 5.8 is ", Math.abs(5.8))
        console.log("Absolute value of -5.8 is ", Math.abs(-5.8))

        console.log("The value of sin(pi) is ", Math.sin(Math.PI))


    </script>
</body>
</html>
