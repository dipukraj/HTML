<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json Tutorial</title>
</head>
<body>
    <div class="container">This is my content</div>
    <script>
        // Your JavaScript code here
        let jsonObj = {
            name: "Dipu",
            channel: "Dipukraj.tech",
            friend: "Gaurav",
            food: "Pizza"
        }
        console.log(jsonObj);
        let myJsonStr = JSON.stringify(jsonObj);
        console.log(myJsonStr);

        myJsonStr = myJsonStr.replace("Dipu", "Dipukraj");
        console.log(myJsonStr);

            
    </script>
</body>
</html>
